name: Build PC
on:
  workflow_dispatch:
  push:
    tags-ignore: ['**']
permissions:
  contents: write
env:
  SINGBOX_VER: 1.11.4
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack the newest source zip (the one with package.json at its root)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $cands = Get-ChildItem -File -Filter '*.zip' | ForEach-Object {
            $t = (git log -1 --format=%ct -- $_.Name) | Select-Object -First 1
            [pscustomobject]@{ File = $_; Ts = $(if ($t) { [int64]$t } else { 0 }) }
          } | Sort-Object Ts -Descending
          $used = $null
          foreach ($c in $cands) {
            $z = [IO.Compression.ZipFile]::OpenRead($c.File.FullName)
            $ok = $false
            foreach ($e in $z.Entries) { if (($e.FullName -replace '\\', '/') -eq 'package.json') { $ok = $true; break } }
            $z.Dispose()
            Write-Host ("found {0}: source={1} (commit time {2})" -f $c.File.Name, $ok, $c.Ts)
            if ($ok -and -not $used) { $used = $c.File }
          }
          if ($used) {
            Write-Host "USING $($used.Name)"
            Expand-Archive -LiteralPath $used.FullName -DestinationPath app -Force
            "PROJ=app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } elseif (Test-Path package.json) {
            Write-Host 'No zip found: building the files from the repository root'
            "PROJ=." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host '::error::Не найден архив с исходниками (vpnhub-pc.zip). Загрузи его в корень репозитория.'
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Stamp build id
        shell: pwsh
        run: |
          $id = (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmm')
          "BUILD_ID=$id" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content -Path "$env:PROJ/build-id.json" -Value ('{"id":"' + $id + '","repo":"' + $env:GITHUB_REPOSITORY + '"}') -Encoding ascii
      - name: Download sing-box core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:PROJ/core" | Out-Null
          $u = "https://github.com/SagerNet/sing-box/releases/download/v$env:SINGBOX_VER/sing-box-$env:SINGBOX_VER-windows-amd64.zip"
          Invoke-WebRequest -Uri $u -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sb -Force
          $exe = Get-ChildItem sb -Recurse -Filter sing-box.exe | Select-Object -First 1
          Copy-Item $exe.FullName "$env:PROJ/core/vpnhub-core.exe"
          Get-ChildItem sb -Recurse -Filter *.dll | ForEach-Object { Copy-Item $_.FullName "$env:PROJ/core/" }
          try {
            Invoke-WebRequest -Uri https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
            Expand-Archive wintun.zip -DestinationPath wintun -Force
            Copy-Item wintun/wintun/bin/amd64/wintun.dll "$env:PROJ/core/wintun.dll"
          } catch { Write-Host "wintun skipped: $_" }
          Get-ChildItem "$env:PROJ/core"
      - name: Build exe
        working-directory: ${{ env.PROJ }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win portable --x64
      - uses: actions/upload-artifact@v4
        with:
          name: VpnHub-PC
          path: ${{ env.PROJ }}/dist/*.exe
      - name: Publish release (for auto-update inside the app)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-Content -Path latest-pc.json -Value ('{"id":"' + $env:BUILD_ID + '"}') -Encoding ascii
          gh release delete pc-latest --yes --cleanup-tag
          gh release create pc-latest "$env:PROJ/dist/VPN-Hub-portable.exe" latest-pc.json --title "PC build $env:BUILD_ID" --notes "Автосборка для автообновления в приложении" --target "${{ github.sha }}"
